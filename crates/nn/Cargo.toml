[package]
name = "lightcraft-nn"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft's ONNX runner (L1): reads a model file (bounded, hostile-input safe) and runs it eagerly on candle tensors, for the optional AI models (selection, inpainting, detection, depth, matting, restoration)"

[lints]
workspace = true

[dependencies]
half = "2"
rayon = { workspace = true }
thiserror = { workspace = true }

# candle's gemm and transposed convolution natively; the web build (which runs no models) uses
# plain loops and leaves candle, which needs a random source wasm32 lacks, out
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }

[dev-dependencies]
lightcraft-testkit = { workspace = true }
