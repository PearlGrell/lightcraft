[package]
name = "lightcraft-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft for phones (L5): a thread-safe handle over the engine for the Android (and later iOS) native UIs"

[lints]
workspace = true

[features]
# AI masks with SAM 3 (Object and Describe). The model itself is an optional 3.4 GB download the
# app offers; without it every other feature works.
sam = ["lightcraft-engine/sam"]

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-raster = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
lightcraft-bgremove = { workspace = true }
lightcraft-codecs = { workspace = true }
