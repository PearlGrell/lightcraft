# LightCraft for Android: builds the engine with cargo-ndk and the Compose app with Gradle, uploads
# the APK, then installs it on an emulator, opens the editor and uploads screenshots.
name: Android

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "apps/lightcraft-android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "apps/lightcraft-android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Engine tests (host)
        run: cargo test -p lightcraft-mobile -p lightcraft-android
      - name: Build the APK
        working-directory: apps/lightcraft-android/android
        run: ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: lightcraft-android-apk
          path: apps/lightcraft-android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/lightcraft-android
      - uses: actions/download-artifact@v4
        with:
          name: lightcraft-android-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash apps/lightcraft-android/android/smoke-test.sh app-release.apk screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightcraft-android-screenshots
          path: screenshots
